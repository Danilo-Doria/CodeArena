services:
  postgres:
    image: postgres:16-alpine
    container_name: code_arena_postgres
    environment:
      POSTGRES_DB: code_arena_db
      POSTGRES_USER: code_arena_user
      POSTGRES_PASSWORD: code_arena_123
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U code_arena_user -d code_arena_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: